<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020203" />
    <title>Break That Denim</title>
    <meta
      name="description"
      content="Experience a realistic denim tear simulation. Interact with virtual denim and explore the look and feel of tearing fabric in your browser."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://denim.scottsun.io" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Denim" />
    <meta property="og:title" content="Denim — Realistic Denim Tear Simulation" />
    <meta
      property="og:description"
      content="Experience a realistic denim tear simulation. Interact with virtual denim and explore the look and feel of tearing fabric in your browser."
    />
    <meta property="og:url" content="https://denim.scottsun.io" />
    <meta property="og:image" content="https://denim.scottsun.io/og_image.jpeg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Denim tear simulation preview" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Denim — Realistic Denim Tear Simulation" />
    <meta
      name="twitter:description"
      content="Experience a realistic denim tear simulation. Interact with virtual denim and explore the look and feel of tearing fabric in your browser."
    />
    <meta name="twitter:image" content="https://denim.scottsun.io/og_image.jpeg" />
    <meta name="twitter:image:alt" content="Denim tear simulation preview" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  </head>
  <body class="loading">
    <header class="brand" aria-label="Break That Denim">
      <span class="brand-kicker" aria-hidden="true">Break that</span>
      <span class="brand-word" aria-hidden="true"
        ><span class="brand-half brand-top">Denim</span><span class="brand-half brand-bottom">Denim</span></span
      >
      <span class="brand-stitch" aria-hidden="true"></span>
    </header>
    <div class="loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span class="loader-rows loader-track"></span>
      <span class="loader-rows loader-fill"></span>
      <span class="loader-needle"></span>
    </div>
    <button class="reset" type="button" aria-label="Reset the denim" title="Reset the denim">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M19.4 13.1a7.5 7.5 0 1 1-2.1-6.4" />
        <path d="M18.3 3.4v3.9h-3.9" />
      </svg>
      <span>Reset</span>
    </button>
    <div class="status" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
